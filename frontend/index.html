<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Kept in step with the theme by src/theme/theme.js; the value here is
         the light one, which is also the fallback if the script below fails. -->
    <meta name="theme-color" content="#f7f5f1" />
    <!-- The same resolve as src/theme/theme.js, repeated here because it has to
         happen before the first paint and a module script is too late for that:
         without it, a dark page flashes light paper on every load. Deliberately
         inline and classic, not deferred. theme.js takes over once it runs. -->
    <script>
      try {
        var stored = localStorage.getItem("grading-system:theme");
      } catch (e) {
        stored = null;
      }
      document.documentElement.dataset.theme =
        stored === "light" || stored === "dark"
          ? stored
          : matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
    </script>
    <!-- Source Serif 4 sets the headings; body text uses the system face, so
         only the display weights are fetched. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
    />
    <title>Grading System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
